<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список товаров — Products Table</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="table-container">
        <div class="table-header">
            <h2>Каталог товаров (Products)</h2>
        </div>
        <table class="styled-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Наименование</th>
                    <th class="numeric">Цена (₽)</th>
                    <th class="numeric">Кол-во</th>
                    <th class="numeric">Итого (₽)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Ноутбук Lenovo IdeaPad 3 15</td>
                    <td class="numeric">45 000.00</td>
                    <td class="numeric">5</td>
                    <td class="numeric total-cell">225 000.00</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Ноутбук ASUS VivoBook 15</td>
                    <td class="numeric">54 000.00</td>
                    <td class="numeric">7</td>
                    <td class="numeric total-cell">378 000.00</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Ноутбук Apple MacBook Air M2</td>
                    <td class="numeric">115 000.00</td>
                    <td class="numeric">2</td>
                    <td class="numeric total-cell">230 000.00</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Ноутбук Dell Inspiron 15</td>
                    <td class="numeric">58 000.00</td>
                    <td class="numeric">6</td>
                    <td class="numeric total-cell">348 000.00</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
