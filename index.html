<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог техники — Supabase</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку Supabase через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="table-container">
        <div class="table-header">
            <h2>Каталог техники и компьютеров</h2>
        </div>
        <table class="styled-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Наименование</th>
                    <th class="numeric">Цена (₽)</th>
                    <th class="numeric">Кол-во</th>
                    <th class="numeric">Итого (₽)</th>
                </tr>
            </thead>
            <!-- Сюда JavaScript автоматически подгрузит данные из базы -->
            <tbody id="table-body">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 20px; color: #888;">Загрузка данных...</td>
                </tr>
            </tbody>
        </table>
        
        <!-- Блок для вывода итоговой статистики -->
        <div id="summary-container" class="table-summary" style="padding: 16px 20px; background-color: #181818; border-top: 1px solid #2c2c2c; display: flex; justify-content: space-between; font-size: 0.9rem;">
            <span>Моделей: <strong>0</strong></span>
            <span>Всего штук: <strong>0</strong></span>
            <span>Общая стоимость: <strong style="color: #3ecf8e;">0.00 ₽</strong></span>
        </div>
    </div>

    <!-- Подключаем ваш файл со скриптом -->
    <script src="script.js"></script>
</body>
</html>
